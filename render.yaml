services:
  - type: web
    name: wastewise-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DEMO_SEED
        value: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wastewise-db
          property: connectionString
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gpt-3.5-turbo
      - key: CORS_ORIGINS
        value: https://wastewise.vercel.app

databases:
  - name: wastewise-db
    plan: free
