version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: wastewise_postgres
    restart: always
    environment:
      POSTGRES_USER: wastewise_user
      POSTGRES_PASSWORD: wastewise_secure_password_2026
      POSTGRES_DB: wastewise_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wastewise_user -d wastewise_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wastewise_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wastewise_user:wastewise_secure_password_2026@db:5432/wastewise_db
      SECRET_KEY: wastewise_super_secret_jwt_key_2026_production_ready
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-3.5-turbo}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
      - ./backend/data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: wastewise_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
